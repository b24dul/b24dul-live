name: Temporary release gate formatting inspection
on:
  push:
    paths:
      - .github/workflows/m2-release-format.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - name: Show exact formatter changes
        working-directory: frontend
        run: |
          npx prettier --write scripts/production-gates.mjs scripts/production-gates.test.mjs
          git diff -- scripts/production-gates.mjs scripts/production-gates.test.mjs
