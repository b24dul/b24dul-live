name: Auto-detect YouTube live stream

on:
  schedule:
    - cron: "2-59/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/scripts/check_live.py"
      - ".github/workflows/auto-live.yml"

permissions:
  contents: write

concurrency:
  group: auto-live-detector
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install detection and Firebase libraries
        run: python -m pip install "yt-dlp>=2026.1" "firebase-admin>=6.5,<8"
      - name: Detect current broadcast and update Firebase on changes
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: python .github/scripts/check_live.py
      - name: Record state for the next check
        run: |
          if git status --porcelain -- live-monitor-state.json | grep -q .; then
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git add live-monitor-state.json
            git commit -m "Record YouTube live transition [skip ci]"
            git push
          else
            echo "No broadcast status change."
          fi
