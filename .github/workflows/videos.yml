name: Update video list

on:
  schedule:
    - cron: "17 */3 * * *"   # every 3 hours
  workflow_dispatch:         # run it by hand from the Actions tab
  push:
    branches: [main]
    paths: [".github/scripts/fetch_videos.py", ".github/workflows/videos.yml"]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python .github/scripts/fetch_videos.py videos.json
      - name: Commit if the list changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add videos.json
          git diff --cached --quiet || (git commit -m "Update video list" && git push)
