name: Deploy B24DUL Live monitor to Cloudflare

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "stream-worker/**"
      - ".github/workflows/deploy-stream-worker.yml"

permissions:
  contents: read

concurrency:
  group: b24dul-cloudflare-stream-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install and run detector tests
        working-directory: stream-worker
        run: |
          npm install --no-audit --no-fund
          npm test
      - name: Check Cloudflare credentials
        id: credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "::warning::Cloudflare deployment skipped. Add CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID and FIREBASE_SERVICE_ACCOUNT_JSON as Actions secrets. See stream-worker/README.md."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy isolated livestream Worker
        if: steps.credentials.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: "stream-worker"
          command: "deploy"
          secrets: |
            FIREBASE_SERVICE_ACCOUNT_JSON
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
