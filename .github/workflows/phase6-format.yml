name: Phase 6 one-time formatting
# Re-run after Lighthouse accessibility fixes; delete once successful.

on:
  push:
    paths:
      - '.github/workflows/phase6-format.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Format Phase 6 frontend
        working-directory: frontend
        run: npm run format
      - name: Commit formatted frontend only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- frontend/
          if ! git diff --cached --quiet; then
            git commit -m "style(qa): format quality tests and reports"
            git push origin HEAD:main
          fi
