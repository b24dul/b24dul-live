name: M1 frontend cross-browser QA

on:
  # Daily, and by hand before big releases (Actions → Run workflow). Not on every PR.
  # GitHub runs schedules from the default branch's copy of this file; each run tests
  # release/react-preview. After each merge to release/react-preview it also runs once,
  # in the background, without holding up PRs.
  schedule:
    - cron: '17 3 * * *'
  push:
    branches: [release/react-preview]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-crossbrowser.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-compatibility:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
        with:
          # Scheduled runs start from the default branch; always test the site being built.
          ref: ${{ github.event_name == 'schedule' && 'release/react-preview' || github.ref }}
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install committed dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Firefox and WebKit browser dependencies
        timeout-minutes: 8
        run: |
          # Regional EC2 mirror downloads stalled on the hosted runner (same fix as auth-emulator.yml).
          sudo find /etc/apt -type f \( -name '*.list' -o -name '*.sources' -o -name 'apt-mirrors.txt' \) -exec sed -i -E 's|http://[a-z0-9.-]+\.ec2\.archive\.ubuntu\.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' {} +
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            printf 'http://archive.ubuntu.com/ubuntu\n' | sudo tee /etc/apt/apt-mirrors.txt
          fi
          npx playwright install --with-deps firefox webkit
      - name: Run existing regression suites on both browser engines
        run: npx playwright test --config=playwright.crossbrowser.config.ts --workers=2
      - name: Upload browser reports on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: frontend-crossbrowser-failures
          path: |
            frontend/test-results/
            frontend/playwright-report/
          if-no-files-found: ignore
          retention-days: 14
