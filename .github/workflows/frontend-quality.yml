name: M1 frontend Phase 6 quality measurements

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-quality.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-quality.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-24.04
    env:
      LIGHTHOUSE_VERSION: '13.6.0' # pinned; update deliberately
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install committed dependencies
        run: npm ci --no-audit --no-fund
      - name: Build production preview (not deployed)
        run: npm run build
      - name: Check compressed JavaScript transfer budget
        run: node scripts/js-budget.mjs
      - name: Install Chrome
        timeout-minutes: 8
        run: |
          # Hosted runners may select a slow regional Ubuntu mirror.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            printf 'http://archive.ubuntu.com/ubuntu\n' | sudo tee /etc/apt/apt-mirrors.txt
          fi
          npx playwright install --with-deps chromium
      - name: Start built preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4174 --strictPort > /tmp/b24dul-preview.log 2>&1 &
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:4174/b24dul-live/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/b24dul-preview.log
          exit 1
      # Three runs per profile, gated on the median (scripts/lighthouse-report.mjs).
      # Single runs vary with runner CPU speed (benchmarkIndex); targets are unchanged.
      - name: Lighthouse mobile, production build (3 runs)
        run: |
          for run in 1 2 3; do
            npx --yes "lighthouse@${LIGHTHOUSE_VERSION}" http://127.0.0.1:4174/b24dul-live/#/ \
              --only-categories=performance,accessibility,best-practices,seo \
              --preset=perf \
              --form-factor=mobile \
              --screenEmulation.mobile=true \
              --screenEmulation.width=390 \
              --screenEmulation.height=844 \
              --screenEmulation.deviceScaleFactor=2 \
              --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" \
              --output=json \
              --output-path="lighthouse-mobile-run${run}.json" \
              --quiet
          done
      - name: Lighthouse desktop, production build (3 runs)
        run: |
          for run in 1 2 3; do
            npx --yes "lighthouse@${LIGHTHOUSE_VERSION}" http://127.0.0.1:4174/b24dul-live/#/ \
              --only-categories=performance,accessibility,best-practices,seo \
              --preset=desktop \
              --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" \
              --output=json \
              --output-path="lighthouse-desktop-run${run}.json" \
              --quiet
          done
      - name: Score on the median and record runner benchmarkIndex
        if: success() || failure()
        run: >
          node scripts/lighthouse-report.mjs
          --mobile lighthouse-mobile-run*.json
          --desktop lighthouse-desktop-run*.json
      - name: Upload Lighthouse evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: phase6-lighthouse-reports
          path: |
            frontend/lighthouse-mobile.json
            frontend/lighthouse-desktop.json
            frontend/lighthouse-*-run*.json
            frontend/lighthouse-summary.json
          if-no-files-found: warn
          retention-days: 30
