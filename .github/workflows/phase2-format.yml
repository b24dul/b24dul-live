name: Phase 2 one-time formatting checkpoint

on:
  push:
    paths:
      - '.github/workflows/phase2-format.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install locked frontend tooling
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Format isolated frontend
        working-directory: frontend
        run: npm run format
      - name: Commit formatting only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- frontend/
          if ! git diff --cached --quiet; then
            git commit -m "style(phase2): format new glass component library"
            git push origin HEAD:main
          fi
