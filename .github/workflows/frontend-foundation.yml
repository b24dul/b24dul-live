name: M1 frontend foundation verification

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-foundation.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-foundation.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  foundation:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Resolve initial lockfile (temporary until committed)
        run: |
          if [ -f package-lock.json ]; then
            echo "Using committed package-lock.json"
          else
            echo "::warning::package-lock.json has not been committed; producing one for review."
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          fi
      - name: Upload lockfile for review
        uses: actions/upload-artifact@v5
        with:
          name: frontend-package-lock
          path: frontend/package-lock.json
          if-no-files-found: error
          retention-days: 14
      - name: Commit generated lockfile and initial Prettier fixes (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          npx prettier --write src/styles/index.css tsconfig.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- frontend/package-lock.json frontend/src/styles/index.css frontend/tsconfig.json
          if ! git diff --cached --quiet; then
            git commit -m "build(phase1): lock dependencies and format initial foundation files"
            git push origin HEAD:main
          else
            echo "No tracked formatting or dependency changes"
          fi
      - name: Install from lockfile
        run: npm ci --no-audit --no-fund
      - name: ESLint
        run: npm run lint
      - name: TypeScript strict checking
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Production build (not deployed)
        run: npm run build
      - name: Formatting check
        run: npm run format:check
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser smoke test
        run: npm run test:e2e
      - name: Upload browser reports on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: frontend-browser-failures
          path: |
            frontend/test-results/
            frontend/playwright-report/
          if-no-files-found: ignore
