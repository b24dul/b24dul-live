name: M2 private RTDB emulator security verification

on:
  workflow_dispatch:

# Requires owner-configured repository secret B24DUL_RTDB_RULES_B64.
# No production Firebase endpoints or credentials are used.
permissions:
  contents: read

jobs:
  security-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Load private snapshot from GitHub Actions secret
        env:
          SNAPSHOT_BASE64: ${{ secrets.B24DUL_RTDB_RULES_B64 }}
        run: |
          if [ -z "$SNAPSHOT_BASE64" ]; then
            echo "::error::Missing private RTDB rules secret. Emulator permission checks must not be marked passed."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/b24dul-rules"
          printf '%s' "$SNAPSHOT_BASE64" | base64 --decode > "$RUNNER_TEMP/b24dul-rules/rtdb.rules.json"
          chmod 600 "$RUNNER_TEMP/b24dul-rules/rtdb.rules.json"
          echo "RTDB_RULES_PATH=$RUNNER_TEMP/b24dul-rules/rtdb.rules.json" >> "$GITHUB_ENV"
      - name: Inspect snapshot before running emulator
        run: node security/rtdb-security-audit.mjs "$RTDB_RULES_PATH"
      - name: Install emulator test dependencies in ephemeral runner only
        working-directory: security
        run: |
          npm init -y >/dev/null
          npm install --no-save --no-package-lock firebase @firebase/rules-unit-testing firebase-tools
      - name: Run actual RTDB authorization tests against local emulator
        run: security/node_modules/.bin/firebase emulators:exec --project demo-b24dul-security --config security/firebase-emulator.json --only database 'node --test security/rtdb-emulator.test.mjs'
      - name: Always remove private rules snapshot
        if: always()
        run: rm -f "$RUNNER_TEMP/b24dul-rules/rtdb.rules.json"
