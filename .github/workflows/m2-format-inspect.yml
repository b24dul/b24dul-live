name: Temporary M2 formatter inspection
on:
  push:
    paths:
      - .github/workflows/m2-format-inspect.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Display expected Prettier change
        working-directory: frontend
        run: |
          npx prettier --write src/services/authSession.ts
          git diff -- src/services/authSession.ts
